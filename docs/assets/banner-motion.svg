<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title">
  <title id="title">AgroPay · Mercado móvil para agricultores y compradores</title>
  <style>
.sunrise { transform-origin: 751px 90px; animation: sun-in 1.65s cubic-bezier(.19,.7,.34,1) both; }
    .crop-lines { animation: field-in 1.9s ease-out both; }
    @keyframes sun-in { from { transform: translateY(16px) scale(.91); opacity: .18; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes field-in { from { opacity: .13; } to { opacity: .69; } }
  </style>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#142b21"/><stop offset=".53" stop-color="#253923"/><stop offset="1" stop-color="#55502c"/></linearGradient>
    <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#f8d183" stop-opacity=".91"/><stop offset=".38" stop-color="#6883a4" stop-opacity=".54"/><stop offset=".8" stop-color="#59718b" stop-opacity=".53"/><stop offset="1" stop-color="#f8d183" stop-opacity=".77"/></linearGradient>
    <linearGradient id="title-color" x2="1" y2=".81"><stop stop-color="#ecffc9"/><stop offset=".46" stop-color="#a5e88b"/><stop offset="1" stop-color="#ffe1a2"/></linearGradient>
    <radialGradient id="shine" cx=".8" cy=".56" r=".57"><stop stop-color="#f8d183" stop-opacity=".16"/><stop offset="1" stop-color="#f8d183" stop-opacity="0"/></radialGradient>
    <clipPath id="outline"><rect x="1" y="1" width="898" height="238" rx="21"/></clipPath>
  </defs>
  <g clip-path="url(#outline)">
    <rect width="900" height="240" fill="url(#surface)"/>
    <rect width="900" height="240" fill="url(#shine)"/>

    <defs>
      <linearGradient id="agro-sun" x2="0" y2="1"><stop stop-color="#fde097" stop-opacity=".85"/><stop offset="1" stop-color="#dba74c" stop-opacity=".16"/></linearGradient>
      <linearGradient id="agro-leaf" x2="1" y2=".72"><stop stop-color="#d8e99a"/><stop offset="1" stop-color="#6eae68"/></linearGradient>
    </defs>
    <circle class="sunrise" cx="751" cy="90" r="61" fill="url(#agro-sun)"/>
    <path d="M426 233c87-73 159-69 244-76 92-7 133-38 230-36v119H426z" fill="#3a5533"/>
    <path d="M493 240c85-62 138-34 216-50 78-17 122-41 191-35v85Z" fill="#213f32"/>
    <g class="crop-lines" fill="none" stroke="#edcd85" stroke-width="1.6" opacity=".69">
      <path d="M467 221c106-61 179-29 261-56 64-21 99-34 170-28"/>
      <path d="M518 232c113-55 172-22 254-54 43-16 82-24 126-19"/>
      <path d="M578 238c108-43 152-27 220-49 32-10 69-16 100-14"/>
    </g>
    <g class="leaf" transform="translate(617 46)" stroke="#c9ee9d" stroke-width="1.4" stroke-linejoin="round">
      <path d="M31 109c4-45 20-66 53-74-6 31-25 51-48 53-4-19-13-29-35-39 1 28 15 38 31 39" fill="url(#agro-leaf)"/>
      <path d="M33 111c3-30 14-48 37-67M3 52l26 29" fill="none" stroke="#305a3e" stroke-linecap="round" stroke-width="2.7"/>
    </g>
    <path d="M60 60h58m-58 0v11" stroke="#e6d58e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="1" y="1" width="898" height="238" rx="21" fill="none" stroke="url(#edge)"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif" class="brand-name" fill="url(#title-color)" font-weight="820">
    <text x="53" y="129" font-size="87" letter-spacing="-4.4"><tspan fill="#d1f4a9">Agro</tspan><tspan fill="#ffda8f">Pay</tspan></text>
  </g>
  <text x="59" y="169" fill="#e2edf0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="500">Mercado móvil para el campo</text>
</svg>
